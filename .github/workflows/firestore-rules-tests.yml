name: Firebase Firestore Rules Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/secure-student-points]

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:rules
